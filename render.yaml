services:
  - type: web
    name: alert-map-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start:server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ALLOWED_ORIGIN
        sync: false
      - key: ALERTS_IN_UA_TOKEN
        sync: false