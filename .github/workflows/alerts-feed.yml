name: Publish alerts feed

on:
  # Наглядач: перезапускає безперервний цикл, якщо ланцюжок зупинився.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: alerts-feed
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    # Один запит на хвилину — це стеля ліміту ключа, тому цикл читає джерело сам
    # і просто передає естафету наступному запуску перед власним дедлайном.
    timeout-minutes: 320
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish per-minute snapshots
        run: node scripts/publish-feed-loop.mjs
        env:
          UKRAINE_ALARM_TOKEN: ${{ secrets.UKRAINE_ALARM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
